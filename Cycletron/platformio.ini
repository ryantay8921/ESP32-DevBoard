[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.10.0
board = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200
upload_speed = 921600

; Flash for N16R8 (board_build.flash_size/psram only apply to the Arduino
; framework builder - espidf reads the board manifest's upload.flash_size
; instead, overridden here. PSRAM is set via sdkconfig.defaults, since
; that's what espidf's kconfgen actually honors.)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Partition table: PlatformIO's espidf builder generates this itself from
; board_build.partitions (default partitions_singleapp.csv, ~1MB app) and
; ignores CONFIG_PARTITION_TABLE_* in sdkconfig entirely for this step.
board_build.partitions = partitions_singleapp_large.csv
